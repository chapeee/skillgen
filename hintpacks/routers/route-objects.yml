id: route-objects
kind: router
about: "Route objects such as { path: '/x', component: Page } (Vue Router, Angular, React Router data routers)"
language: typescript
globs: ["**/*.ts", "**/*.mts", "**/*.cts"]
rule:
  kind: object
  all:
    - has:
        kind: pair
        all:
          - has: { field: key, regex: "^path$" }
          - has: { field: value, pattern: $PATH }
    - has:
        kind: pair
        all:
          - has: { field: key, regex: "^(component|element)$" }
          - has: { field: value, pattern: $COMPONENT }
captures:
  path: PATH
  component: COMPONENT
